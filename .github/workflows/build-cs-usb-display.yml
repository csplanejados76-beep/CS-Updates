name: Build CS USB Display

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/cs-usb-display-*'
    paths:
      - 'CS-USB-Display/**'
      - '.github/workflows/build-cs-usb-display.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CS-USB-Display/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../CS-USB-Display-v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CS-USB-Display-APK-v0.2.0
          path: CS-USB-Display/CS-USB-Display-v0.2.0.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate PowerShell launcher
        shell: pwsh
        run: |
          $source = Get-Content CS-USB-Display/PowerShell/Start-CSUSBDisplay.ps1 -Raw
          [scriptblock]::Create($source) | Out-Null
      - name: Publish Windows host
        shell: pwsh
        run: |
          dotnet publish CS-USB-Display/windows/CSUsbDisplayHost/CSUsbDisplayHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/windows
      - name: Bundle launcher and documentation
        shell: pwsh
        run: |
          Copy-Item CS-USB-Display/PowerShell/Start-CSUSBDisplay.ps1 out/windows/Start-CSUSBDisplay.ps1
          Copy-Item CS-USB-Display/README.md out/windows/README.md
      - name: Bundle ADB platform-tools
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath out/windows -Force
      - name: Package Windows program
        shell: pwsh
        run: Compress-Archive -Path out/windows/* -DestinationPath CS-USB-Display-Windows-v0.2.1.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CS-USB-Display-Windows-v0.2.1
          path: CS-USB-Display-Windows-v0.2.1.zip
          if-no-files-found: error
